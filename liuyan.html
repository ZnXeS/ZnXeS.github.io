<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>登录留言</title>
  <style>
    body{font-family:"微软雅黑",sans-serif;font-size:14px;color:#333;background:#f5f6fa;margin:0;padding:0}
    .container{width:90%;margin:0 auto;padding:2%}
    a{text-decoration:none}
    .message {
      display: inline-block;
      font-size: 12px;
      color: #999;
      padding-left: 20px;
    }
    .wrong {
      color: red;
    }
    .right {
      color: green;
    }
    textarea {
      width: 200px;
      height: 100px;
      border: 1px solid pink;
      outline: none;
      resize: none;
    }
    ul {
      margin-top: 50px;
    }
    li {
      width: 300px;
      padding: 5px;
      background-color: #eee;
      font-size: 14px;
      margin: 15px 0;
    }
    li a {
      float: right;
    }
  </style>
</head>
<body>

  <table width="100%" cellpadding="0" cellspacing="0" style="background:hsl(40, 83%, 47%);">
    <tr>
      <td align="center" style="padding:50px 20px;">
        <h1><font size="6" color="#fff">登录留言</font></h1>
      </td>
    </tr>
  </table>
  <div class="container">
    <div class="register">
      <center>
        <h2><font size="5" color="#333">登录</font></h2>
        <p><font size="3"><b>用户名</b></font><br><input type="text" class="iptUser"></p>
        <p><font size="3"><b>密码</b></font><br><input type="password" class="iptPass"></p>
        <p class="message">请输入6~16位密码</p>
        <p class="result"></p>
        <p>
          <button class="btnLogin">登录</button>&nbsp;
          <button class="btnRegister">注册</button>
        </p>
      </center>
    </div>

    <div class="msgbox" style="display:none;">
      <p>欢迎<b class="showUser"></b>&nbsp;&nbsp;<button class="btnLogout">退出</button></p>
      <hr>
      <textarea class="commentInput"></textarea>
      <button class="btnPost">发布</button>
      <ul class="msgList"></ul>
    </div>
  </div>
  <a href="index.html" style="position:fixed;right:5%;bottom:5%;"><font size="3">← 返回首页</font></a>

  <script type="text/javascript">
    var accounts = {};
    var sessionUser = '';

    var iptUser = document.querySelector('.iptUser');
    var iptPass = document.querySelector('.iptPass');
    var message = document.querySelector('.message');
    var result = document.querySelector('.result');
    var register = document.querySelector('.register');
    var msgbox = document.querySelector('.msgbox');
    var showUser = document.querySelector('.showUser');
    var commentInput = document.querySelector('.commentInput');
    var msgList = document.querySelector('.msgList');

    function updateUI() {
      if (sessionUser) {
        register.style.display = 'none';
        msgbox.style.display = 'block';
        showUser.innerHTML = sessionUser;
      } else {
        register.style.display = 'block';
        msgbox.style.display = 'none';
      }
    }

    iptPass.onblur = function() {
      if (this.value.length < 6 || this.value.length > 16) {
        message.className = 'message wrong';
        message.innerHTML = '您输入的位数不对要求6~16位';
      } else {
        message.className = 'message right';
        message.innerHTML = '您输入的正确';
      }
    };

    document.querySelector('.btnLogin').onclick = function() {
      var u = iptUser.value;
      var p = iptPass.value;
      if (u == '' || p == '') {
        result.className = 'message wrong';
        result.innerHTML = '请填写用户名和密码';
        return false;
      }
      if (!accounts[u]) {
        result.className = 'message wrong';
        result.innerHTML = '用户名不存在，请先注册';
        return false;
      }
      if (accounts[u] !== p) {
        result.className = 'message wrong';
        result.innerHTML = '密码不正确';
        return false;
      }
      result.className = 'message right';
      result.innerHTML = '登录成功';
      sessionUser = u;
      updateUI();
    };

    document.querySelector('.btnRegister').onclick = function() {
      var u = iptUser.value;
      var p = iptPass.value;
      if (u.length < 3) {
        result.className = 'message wrong';
        result.innerHTML = '用户名至少3个字符';
        return false;
      }
      if (p.length < 6 || p.length > 16) {
        result.className = 'message wrong';
        result.innerHTML = '密码需要6~16位';
        return false;
      }
      if (accounts[u]) {
        result.className = 'message wrong';
        result.innerHTML = '用户名已存在';
        return false;
      }
      accounts[u] = p;
      result.className = 'message right';
      result.innerHTML = '注册成功';
      sessionUser = u;
      updateUI();
    };

    document.querySelector('.btnLogout').onclick = function() {
      sessionUser = '';
      updateUI();
    };

    document.querySelector('.btnPost').onclick = function() {
      if (commentInput.value == '') {
        alert('您没有输入内容！');
        return false;
      }
      var li = document.createElement('li');
      li.innerHTML = commentInput.value + '<a href="javascript::">删除</a>';
      msgList.insertBefore(li, msgList.childNodes[0]);

      var as = document.querySelectorAll('a');
      for (var i = 0; i < as.length; i++) {
        as[i].onclick = function() {
          msgList.removeChild(this.parentNode);
        };
      }

      commentInput.value = '';
    };

    updateUI();
  </script>

</body>
</html>
