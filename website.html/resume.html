<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>个人简历</title>
  <style>
    *{margin:0;padding:0}
    body{font-family:"微软雅黑",sans-serif;font-size:14px;color:#333;background:#e8e8e8}
    .page{width:794px;margin:0 auto;background:#fff;padding:50px 60px}

    h1{text-align:center;font-size:28px;letter-spacing:8px;margin-bottom:20px}

    .info-table{width:100%;border-collapse:collapse;margin-bottom:18px}
    .info-table td{border:1px solid #666;padding:8px 10px;font-size:14px}
    .info-table .label{background:#f0f0f0;width:80px;text-align:center;font-weight:bold}
    .photo{width:100px;text-align:center}

    .section-title{font-size:16px;font-weight:bold;border-left:4px solid #333;padding-left:10px;margin:22px 0 12px 0}

    .item-table{width:100%;border-collapse:collapse;margin-bottom:6px}
    .item-table td{border:1px solid #999;padding:8px 10px;font-size:14px}
    .item-table .header{background:#f5f5f5;font-weight:bold;text-align:center}

    .skill-list{padding-left:20px;line-height:26px}
    .skill-list li{margin-bottom:2px}

    .self-text{text-indent:2em;line-height:24px}

    @media print{
      body{background:#fff}
      .page{box-shadow:none;padding:30px 40px}
      .no-print{display:none}
    }
  </style>
</head>
<body>

  <p class="no-print" style="text-align:center;padding:20px;color:#999;font-size:12px;">
    简历模版 &nbsp;|&nbsp; <a href="#" onclick="window.print();return false;">点击打印</a> &nbsp;|&nbsp; 快捷键 Ctrl+P
  </p>

  <div class="page">

    <!-- 姓名 -->
    <h1>个 人 简 历</h1>

    <!-- 基本信息 -->
    <table class="info-table">
      <tr>
        <td class="label">姓名</td>
        <td width="170"></td>
        <td class="label">性别</td>
        <td width="100"></td>
        <td class="label">出生年月</td>
        <td width="130"></td>
        <td class="photo" rowspan="4">
          照片
        </td>
      </tr>
      <tr>
        <td class="label">民族</td>
        <td></td>
        <td class="label">籍贯</td>
        <td></td>
        <td class="label">政治面貌</td>
        <td></td>
      </tr>
      <tr>
        <td class="label">学历</td>
        <td></td>
        <td class="label">专业</td>
        <td></td>
        <td class="label">毕业院校</td>
        <td></td>
      </tr>
      <tr>
        <td class="label">手机</td>
        <td></td>
        <td class="label">邮箱</td>
        <td colspan="3"></td>
      </tr>
    </table>

    <!-- 求职意向 -->
    <div class="section-title">求职意向</div>
    <table class="item-table">
      <tr>
        <td class="header" width="100">意向岗位</td>
        <td width="250"></td>
        <td class="header" width="100">期望城市</td>
        <td width="150"></td>
        <td class="header" width="100">期望薪资</td>
        <td></td>
      </tr>
      <tr>
        <td class="header">工作性质</td>
        <td></td>
        <td class="header">到岗时间</td>
        <td colspan="3"></td>
      </tr>
    </table>

    <!-- 教育背景 -->
    <div class="section-title">教育背景</div>
    <table class="item-table">
      <tr>
        <td class="header">时间</td>
        <td class="header">学校</td>
        <td class="header">专业</td>
        <td class="header">学历</td>
      </tr>
      <tr>
        <td align="center">2025.09 - 2028.06</td>
        <td align="center"></td>
        <td align="center">软件技术</td>
        <td align="center">专科</td>
      </tr>
    </table>

    <!-- 技能证书 -->
    <div class="section-title">技能与证书</div>
    <ul class="skill-list">
      <li>编程语言：</li>
      <li>开发工具：</li>
      <li>数据库：</li>
      <li>证书：</li>
    </ul>

    <!-- 项目经历 -->
    <div class="section-title">项目经历</div>
    <table class="item-table">
      <tr>
        <td class="header">时间</td>
        <td class="header">项目名称</td>
        <td class="header">担任角色</td>
      </tr>
      <tr>
        <td align="center" height="60"></td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <td colspan="3">
          <b>项目描述：</b><br>
          <b>技术栈：</b><br>
          <b>主要职责：</b>
        </td>
      </tr>
    </table>

    <!-- 荣誉奖项 -->
    <div class="section-title">荣誉奖项</div>
    <table class="item-table">
      <tr>
        <td class="header">时间</td>
        <td class="header">奖项名称</td>
        <td class="header">级别</td>
      </tr>
      <tr>
        <td align="center" height="24"></td>
        <td></td>
        <td align="center"></td>
      </tr>
      <tr>
        <td align="center" height="24"></td>
        <td></td>
        <td align="center"></td>
      </tr>
    </table>

    <!-- 自我评价 -->
    <div class="section-title">自我评价</div>
    <p class="self-text"></p>

  </div>

  <p class="no-print" style="text-align:center;padding:20px;color:#999;font-size:12px;">
    简历模版 &nbsp;|&nbsp; <a href="#" onclick="window.print();return false;">点击打印</a>
  </p>

</body>
</html>
